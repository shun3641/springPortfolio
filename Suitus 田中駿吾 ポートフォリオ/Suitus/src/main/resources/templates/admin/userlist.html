<!DOCTYPE html>
<html lang="en" 
xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<link th:href="@{/admin/css/application.css}" rel="stylesheet">
<title>Insert title here</title>
</head>
<body>
<h3>ユーザーリスト</h3>
<table>
  <thead>
    <tr>
      <th scope="col">id</th>
      <th scope="col">名前</th>
      <th scope="col">email</th>
    </tr>
  </thead>
  <tbody th:each="user: ${users}">
    <tr>
      <th th:text="${user.id}">22</th>
      <td th:text="${user.username}"></td>
      <td th:text="${user.email}"></td>
    </tr>  
  </tbody>
</table>
</body>
</html>
